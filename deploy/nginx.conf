# Replace gate.example.com with the school's real domain before installing.
server {
    listen 80;
    server_name gate.example.com;
    root /srv/srps/current/client/dist;
    index index.html;
    client_max_body_size 6m;
    include /etc/nginx/snippets/srps-security.conf;
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Approval tokens are URL credentials. Keep API URLs out of access logs.
        access_log off;
    }
    location ~ ^/(parent/(approve|pass)|gate/(verify|scanner)|reset-password)/ {
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/srps-security.conf;
        try_files $uri /index.html;
    }
    location /assets/ {
        include /etc/nginx/snippets/srps-security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/srps-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
